name: Load Test Syntax Check
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check load test scripts
        run: |
          find load-tests -name "*.js" -print0 | while IFS= read -r -d '' file; do
            node --check "$file" || exit 1
          done
