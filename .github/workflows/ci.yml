
name: Event Management System CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1: BACKEND TESTS
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: event_management_system_loadtest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: event_management_system_loadtest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm install --prefix backend

      - name: Prepare isolated database schema
        run: node load-tests/prepare-isolated-database.js

      - name: Run backend tests
        shell: bash
        run: |
          set +e
          node --test --test-force-exit --test-reporter=tap > backend-test.tap 2>&1
          TEST_STATUS=$?
          cat backend-test.tap
          exit $TEST_STATUS

      - name: Publish backend test summary
        if: always()
        shell: bash
        run: |
          echo "## Backend Test Report" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"

          if [ -f backend-test.tap ]; then
            for metric in tests pass fail cancelled skipped; do
              value=$(awk -v key="$metric" '$1 == "#" && $2 == key {print $3; found=1} END {if (!found) print "N/A"}' backend-test.tap)
              echo "| ${metric^} | $value |" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "| Test results | Report unavailable |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend-test.tap
          if-no-files-found: warn

  # JOB 2: FRONTEND VALIDATION
  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        shell: bash
        run: |
          set +e
          npm install --prefix frontend > frontend-build.log 2>&1
          STATUS=$?
          cat frontend-build.log
          exit $STATUS

      - name: Build frontend
        shell: bash
        run: |
          set +e
          npm run build --prefix frontend >> frontend-build.log 2>&1
          STATUS=$?
          cat frontend-build.log
          exit $STATUS

      - name: Upload frontend build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-report
          path: frontend-build.log
          if-no-files-found: warn

  # JOB 3: COLLECT TEST REPORTS
  collect-test-reports:
    name: Collect Test Reports
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-validation
    if: always()

    steps:
      - name: Download backend test report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: backend-test-report
          path: reports/backend

      - name: Download frontend build report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-report
          path: reports/frontend

      - name: Generate combined CI summary
        if: always()
        shell: bash
        run: |
          echo "# Event Management System CI Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Job Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend Tests | ${{ needs.backend-tests.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend Validation | ${{ needs.frontend-validation.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Collect Test Reports | Completed |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Detailed logs are available in the workflow artifacts." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ems-complete-ci-reports
          path: reports/
          if-no-files-found: warn
